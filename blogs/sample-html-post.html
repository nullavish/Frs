<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A sample HTML post</title>
  <meta name="description" content="A sample post written as plain HTML. Delete it and add your own.">
  <meta name="date" content="2026-10-11">
  <meta name="keywords" content="html, sample">
  <style>
    .callout { border: 2px dashed currentColor; padding: 1rem 1.25rem; border-radius: 1rem; }
  </style>
</head>
<body>
  <h2>HTML posts work too</h2>
  <p>Write a normal HTML file. The title, description, date and keywords come from the tags in <code>&lt;head&gt;</code>.</p>
  <p class="callout">Your own &lt;style&gt; rules apply only inside this article, so they can't break the rest of the site. Scripts are removed.</p>
</body>
</html>
